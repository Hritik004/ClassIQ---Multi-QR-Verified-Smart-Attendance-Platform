<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — ClassIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --violet-1:#6a5ff0;
    --violet-2:#8b5cf6;
    --violet-3:#4f46e5;
    --ink:#211f36;
    --muted:#6b6885;
    --card:#ffffff;
    --hair:rgba(33,31,54,0.08);
    --mint:#00c896;
    --danger:#e0455a;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(139,92,246,0.16), transparent),
      radial-gradient(900px 500px at -10% 20%, rgba(106,95,240,0.14), transparent),
      #f7f6fb;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}

  .card{
    width:100%;
    max-width:400px;
    background:var(--card);
    border:1px solid var(--hair);
    border-radius:22px;
    box-shadow:0 30px 70px rgba(76,63,180,0.14);
    padding:40px 36px 32px;
  }

  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    margin-bottom:26px;
  }
  .brand .dot{
    width:9px;height:9px;border-radius:2px;
    background:linear-gradient(135deg,var(--violet-1),var(--mint));
  }
  .brand span{
    font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:-0.01em;
  }

  h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.7rem;
    text-align:center;
    letter-spacing:-0.01em;
    margin-bottom:6px;
  }
  .sub{
    text-align:center;
    color:var(--muted);
    font-size:0.94rem;
    margin-bottom:30px;
  }

  form{display:flex;flex-direction:column;gap:18px;}

  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:7px;
    color:var(--ink);
  }
  .field input{
    width:100%;
    padding:13px 15px;
    border:1.5px solid var(--hair);
    border-radius:11px;
    font-size:15px;
    font-family:var(--font-body);
    color:var(--ink);
    background:#fbfaff;
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .field input::placeholder{color:#a9a6bd;}
  .field input:focus{
    outline:none;
    border-color:var(--violet-1);
    background:#fff;
    box-shadow:0 0 0 4px rgba(106,95,240,0.12);
  }
  .field input.invalid{border-color:var(--danger);animation:shake .4s ease-in-out;}
  @keyframes shake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

  .row-between{display:flex;justify-content:flex-end;margin-top:-8px;}
  .row-between a{font-size:13px;color:var(--violet-3);font-weight:500;}
  .row-between a:hover{text-decoration:underline;}

  .btn-primary{
    margin-top:4px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:11px;
    font-size:15px;
    font-weight:600;
    color:#fff;
    background:linear-gradient(135deg,var(--violet-1),var(--violet-3));
    box-shadow:0 12px 26px rgba(106,95,240,0.28);
    cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 16px 34px rgba(106,95,240,0.34);}
  .btn-primary:disabled{opacity:0.65;cursor:not-allowed;transform:none;}

  .divider{
    display:flex;align-items:center;gap:14px;
    color:var(--muted);font-size:12px;
    margin:22px 0 18px;
  }
  .divider::before,.divider::after{
    content:'';flex:1;height:1px;background:var(--hair);
  }

  .btn-google{
    width:100%;
    padding:12px;
    border:1.5px solid var(--hair);
    border-radius:11px;
    background:#fff;
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    cursor:pointer;
    transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .btn-google:hover{border-color:#d5d2e8;transform:translateY(-1px);box-shadow:0 8px 20px rgba(33,31,54,0.06);}
  .btn-google svg{width:18px;height:18px;}

  .switch{
    text-align:center;
    margin-top:26px;
    font-size:13.5px;
    color:var(--muted);
  }
  .switch a{color:var(--violet-3);font-weight:600;}
  .switch a:hover{text-decoration:underline;}

  .toast{
    position:fixed;top:22px;right:22px;
    background:var(--ink);color:#fff;
    padding:13px 20px;border-radius:10px;
    font-size:13.5px;font-weight:500;
    box-shadow:0 14px 30px rgba(33,31,54,0.22);
    z-index:999;
    animation:toastIn .25s ease-out;
    max-width:300px;
  }
  .toast.success{background:var(--mint);}
  .toast.error{background:var(--danger);}
  @keyframes toastIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

  @media (max-width:460px){
    .card{padding:32px 24px 26px;border-radius:18px;}
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand"><span class="dot"></span><span>ClassIQ</span></div>
  <h1>Welcome back</h1>
  <p class="sub">Log in to mark or manage attendance.</p>

  <form id="login-form" novalidate>
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@college.edu" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>
    </div>
    <div class="row-between"><a href="#" id="forgot">Forgot password?</a></div>

    <button type="submit" class="btn-primary" id="submit-btn">Log in</button>
  </form>

  <div class="divider">or</div>

  <button type="button" class="btn-google" id="google-btn">
    <svg viewBox="0 0 48 48">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.7l5.7-5.7C33.5 6.5 29 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c2.8 0 5.3 1 7.3 2.7l5.7-5.7C33.5 6.5 29 4.5 24 4.5c-7.7 0-14.4 4.4-17.7 10.2z"/>
      <path fill="#4CAF50" d="M24 43.5c5 0 9.5-1.9 12.9-5.1l-6-4.9C29.1 35.4 26.7 36 24 36c-5.3 0-9.6-2.6-11.4-6.9l-6.6 5.1C9.6 39 16.3 43.5 24 43.5z"/>
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6 4.9C39.7 36.4 43.5 30.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/>
    </svg>
    Continue with Google
  </button>

  <p class="switch">Don't have an account? <a href="/signup">Sign up</a></p>
</div>

<script>
  function showToast(msg, type){
    const t = document.createElement('div');
    t.className = 'toast' + (type ? ' ' + type : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition='opacity .25s'; setTimeout(()=>t.remove(),250); }, 2600);
  }

  const form = document.getElementById('login-form');
  const btn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email');
    const password = document.getElementById('password');

    if (!email.value.trim() || !password.value.trim()) {
        showToast('Please fill in both fields', 'error');
        return;
    }

    btn.textContent = 'Logging in…';
    btn.disabled = true;


    try {

        const response = await fetch('/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                email: email.value.trim(),
                password: password.value.trim()
            })
        });


        const data = await response.json();


        if(response.ok && data.success){

            showToast('Login successful', 'success');

            setTimeout(()=>{
                window.location.href='/dashboard';
            },1000);

        }
        else{

            showToast(data.message || 'Invalid credentials','error');

        }


    } catch(error){

        showToast('Server error','error');
        console.log(error);

    }
    finally{

        btn.textContent='Log in';
        btn.disabled=false;

    }

});

  document.getElementById('google-btn').addEventListener('click', () => {
    showToast('Redirecting to Google…');
  });

  document.getElementById('forgot').addEventListener('click', (e) => {
    e.preventDefault();
    showToast('Password reset link sent if the email exists.');
  });
</script>

</body>
</html>
